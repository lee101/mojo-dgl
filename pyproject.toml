[project]
name = "mojo-dgl"
version = "0.1.0"
description = "DGL's graph message-passing kernels, implemented in Mojo"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
test = ["pytest", "dgl==2.3.0", "torch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/mojodgl"]
